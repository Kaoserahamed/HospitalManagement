[project]
name = "hospital-management-backend"
version = "1.0.0"
description = "Hospital Management System API — FastAPI + SQLAlchemy 2 + MySQL 8"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "asyncmy==0.2.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "pwdlib[argon2]==0.2.1",
    "python-multipart==0.0.12",
    "email-validator==2.1.0",
    "mangum==0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
    "ruff==0.7.1",
    "mypy==1.13.0",
    "types-python-jose==3.3.0.20240106",
    "pip-tools==7.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "controllers", "dependencies", "models", "repositories", "routes", "schemas", "services"]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter (line length aligned with .editorconfig)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit subset (security)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "S101",  # asserts allowed in tests
    "S105", "S106",  # string literals in tests are not real secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/versions"]

# ---------------------------------------------------------------------------
# pytest — unit tests by default; integration tests require DATABASE URI
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require a live MySQL instance (deselected by default)",
]

[tool.coverage.run]
source = ["core", "services", "repositories", "controllers", "routes", "schemas", "dependencies"]
omit = ["alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
